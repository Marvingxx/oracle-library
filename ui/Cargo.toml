[package]
name = "oracle-library-ui"
description = "The library browser (egui), shared by Oracle Suite, Oracle Edit and Oracle Vector."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oracle-library = { workspace = true }
oracle-suite-link = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp"] }
resvg = "0.45"
rfd = "0.17"

# The pointer at a file drop (winit's drops carry no position): in_app::os_pointer.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
